  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #E5E7EB;
      border-top: 4px solid #3F51B5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .loading-text {
      margin-top: 20px;
      color: #6B7280;
      font-size: 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Chargement...</div>
  </div>
  
  <script>
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading').style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service-worker.js').then(function(reg) {
          // Check for SW updates on every page load
          reg.update();

          // Listen for new service workers
          reg.addEventListener('updatefound', function() {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed') {
                  // New SW installed, notify Flutter via custom event
                  window.dispatchEvent(new CustomEvent('sw-update-ready'));
                }
              });
            }
          });
        });
      });
    }

    // PWA Install Prompt
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      // Notify Flutter that install is available
      window.dispatchEvent(new CustomEvent('pwa-install-available'));
    });

    window.addEventListener('appinstalled', function() {
      deferredPrompt = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });

    // Exposed for Flutter to trigger the install prompt
    window.triggerInstallPrompt = function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          deferredPrompt = null;
          window.dispatchEvent(new CustomEvent(choiceResult.outcome === 'accepted' ? 'pwa-installed' : 'pwa-install-dismissed'));
        });
      }
    };
    window.addEventListener('flutter-trigger-install', function() {
      if (deferredPrompt) deferredPrompt.prompt();
    });
  </script>
